services:
  db:
    container_name : postgres_road_assist
    image : postgres:latest
    environment:
      POSTGRES_USER : mananc
      POSTGRES_PASSWORD : 123456
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db:
