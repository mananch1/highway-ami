[prod_servers]
# Replace with Azure VM 2 IP address (private IP if in same VNet, or public IP)
prod_vm ansible_host=PROD_VM_IP_PLACEHOLDER ansible_user=mananc ansible_ssh_private_key_file=/var/lib/jenkins/.ssh/id_rsa ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[prod_servers:vars]
app_name=road-helper
app_port=8080
db_port=5432
app_dir=/opt/road-helper
backup_dir=/opt/road-helper/backups
app_version=1.0.0
